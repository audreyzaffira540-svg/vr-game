<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Lost Lab - VR Escape Room</title>

  <!-- A-Frame creates the 3D environment -->
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>

<body>

<a-scene background="color: #10172b">

  <!-- LIGHTING -->
  <a-entity light="type: ambient; intensity: 0.8"></a-entity>
  <a-entity light="type: point; intensity: 1.5; color: #36bfff"
            position="0 3 -3"></a-entity>

  <!-- ROOM -->
  <a-box position="0 0 -2" width="10" height="0.2"
         depth="10" color="#30394f"></a-box>

  <a-box position="0 3 -7" width="10" height="6"
         depth="0.2" color="#202b45"></a-box>

  <a-box position="-5 3 -2" width="0.2" height="6"
         depth="10" color="#273650"></a-box>

  <a-box position="5 3 -2" width="0.2" height="6"
         depth="10" color="#273650"></a-box>

  <a-box position="0 6 -2" width="10" height="0.2"
         depth="10" color="#202b45"></a-box>

  <!-- ROOM LIGHTS -->
  <a-box position="-2 5.8 -2" width="2" height="0.08"
         depth="0.3" color="#35cfff"></a-box>
  <a-box position="2 5.8 -2" width="2" height="0.08"
         depth="0.3" color="#35cfff"></a-box>

  <!-- GAME TITLE AND INSTRUCTIONS -->
  <a-text value="THE LOST LAB"
          position="-1.5 4.8 -6.85"
          color="#56e5ff" width="5"></a-text>

  <a-text value="Find the energy key."
          position="-2.1 4.2 -6.85"
          color="white" width="4"></a-text>

  <a-text value="Discover the code: 314"
          position="-2.1 3.8 -6.85"
          color="#ffd166" width="4"></a-text>

  <!-- PUZZLE 1: ENERGY KEY -->
  <a-cylinder id="keyBase"
              position="-2 0.5 -2.5"
              radius="0.65" height="0.4"
              color="#46516b"></a-cylinder>

  <a-sphere id="energyKey"
             class="clickable"
             position="-2 1.35 -2.5"
             radius="0.35"
             color="#00eaff"
             material="emissive: #00aaff; emissiveIntensity: 1"
             animation="property: rotation; to: 0 360 0;
                        loop: true; dur: 4000">
  </a-sphere>

  <a-text value="ENERGY KEY"
          position="-2.8 0.9 -2.5"
          color="white" width="2.5"></a-text>

  <!-- PUZZLE 2: SECURITY PANEL -->
  <a-box position="2 1.8 -3.5"
         width="2.5" height="2.5" depth="0.25"
         color="#151c30"></a-box>

  <a-text value="SECURITY PANEL"
          position="1.05 2.7 -3.34"
          color="#56e5ff" width="3"></a-text>

  <!-- CODE BUTTONS -->
  <a-box id="button3" class="clickable"
         position="1.4 2.1 -3.3"
         width="0.45" height="0.45" depth="0.12"
         color="#3278a8"></a-box>
  <a-text value="3" position="1.32 2.02 -3.22"
          color="white" width="1.5"></a-text>

  <a-box id="button1" class="clickable"
         position="2 2.1 -3.3"
         width="0.45" height="0.45" depth="0.12"
         color="#3278a8"></a-box>
  <a-text value="1" position="1.92 2.02 -3.22"
          color="white" width="1.5"></a-text>

  <a-box id="button4" class="clickable"
         position="2.6 2.1 -3.3"
         width="0.45" height="0.45" depth="0.12"
         color="#3278a8"></a-box>
  <a-text value="4" position="2.52 2.02 -3.22"
          color="white" width="1.5"></a-text>

  <a-box id="submitButton" class="clickable"
         position="2 1.35 -3.3"
         width="1.4" height="0.45" depth="0.12"
         color="#16876b"></a-box>
  <a-text value="SUBMIT"
          position="1.55 1.27 -3.22"
          color="white" width="2"></a-text>

  <!-- EXIT DOOR -->
  <a-box id="exitDoor" class="clickable"
         position="0 1.7 -6.75"
         width="1.8" height="3.2" depth="0.25"
         color="#8b3545"></a-box>

  <a-text value="EXIT"
          position="-0.45 1.7 -6.58"
          color="white" width="2"></a-text>

  <!-- STATUS MESSAGE -->
  <a-text id="statusText"
          value="Find the energy key to begin!"
          position="-2.5 0.4 -3"
          color="#ffffff" width="5"></a-text>

  <!-- PLAYER CAMERA -->
  <a-entity position="0 1.6 4">
    <a-camera wasd-controls="acceleration: 20"
              look-controls
              cursor="rayOrigin: mouse"
              raycaster="objects: .clickable; far: 20">
    </a-camera>
  </a-entity>

</a-scene>

<script>
  // GAME STATE VARIABLES
  let hasKey = false;
  let codeSolved = false;
  let hasEscaped = false;
  let enteredCode = "";

  const correctCode = "314";

  const statusText = document.querySelector("#statusText");
  const energyKey = document.querySelector("#energyKey");
  const exitDoor = document.querySelector("#exitDoor");

  // Display feedback to the player
  function showMessage(message) {
    statusText.setAttribute("value", message);
  }

  // PUZZLE 1: Collect the energy key
  energyKey.addEventListener("click", function () {
    if (!hasKey) {
      hasKey = true;
      energyKey.setAttribute("visible", false);
      showMessage("Energy key collected! Find the security panel.");
    } else {
      showMessage("You already have the energy key.");
    }
  });

  // Add a digit to the security code
  function addDigit(digit) {
    if (!hasKey) {
      showMessage("You need the energy key first!");
    } else if (codeSolved) {
      showMessage("The security panel is already unlocked.");
    } else if (enteredCode.length >= 3) {
      enteredCode = digit;
      showMessage("Code reset. Enter the three digits again.");
    } else {
      enteredCode += digit;
      showMessage("Code entered: " + "*".repeat(enteredCode.length));
    }
  }

  // Connect the number buttons to the function
  document.querySelector("#button3").addEventListener("click", function () {
    addDigit("3");
  });

  document.querySelector("#button1").addEventListener("click", function () {
    addDigit("1");
  });

  document.querySelector("#button4").addEventListener("click", function () {
    addDigit("4");
  });

  // PUZZLE 2: Check the security code
  document.querySelector("#submitButton").addEventListener("click", function () {
    if (!hasKey) {
      showMessage("Collect the energy key before using the panel!");
    } else if (enteredCode === correctCode) {
      codeSolved = true;
      showMessage("Correct code! The exit is now unlocked.");
      exitDoor.setAttribute("color", "#16876b");
    } else {
      enteredCode = "";
      showMessage("Incorrect code. Try again!");
    }
  });

  // FINAL GOAL: Escape the laboratory
  exitDoor.addEventListener("click", function () {
    if (hasEscaped) {
      showMessage("You have already escaped. Congratulations!");
    } else if (!hasKey) {
      showMessage("The door is locked. Find the energy key!");
    } else if (!codeSolved) {
      showMessage("Solve the security panel before escaping!");
    } else {
      hasEscaped = true;
      exitDoor.setAttribute("color", "#00cc88");
      showMessage("YOU ESCAPED THE LOST LAB! Congratulations!");
    }
  });
</script>

</body>
</html>
