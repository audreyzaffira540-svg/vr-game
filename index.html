
<!DOCTYPE html>
<html>
<head>
  <title>The Mystery Escape Room</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>

<body>

<a-scene background="color: #b9d8ed">

  <!-- Lighting -->
  <a-entity light="type: ambient; intensity: 1.5"></a-entity>
  <a-entity light="type: directional; intensity: 1.5"
            position="-3 8 5"></a-entity>

  <!-- Floor -->
  <a-plane rotation="-90 0 0"
           width="12" height="12"
           color="#b8a58d"></a-plane>

  <!-- Walls -->
  <a-box position="0 2 -6"
         width="12" height="4" depth="0.2"
         color="#91b5d0"></a-box>

  <a-box position="-6 2 0"
         width="0.2" height="4" depth="12"
         color="#a6c5dd"></a-box>

  <a-box position="6 2 0"
         width="0.2" height="4" depth="12"
         color="#a6c5dd"></a-box>

  <a-box position="0 2 6"
         width="12" height="4" depth="0.2"
         color="#91b5d0"></a-box>

  <!-- Ceiling -->
  <a-box position="0 4 0"
         width="12" height="0.2" depth="12"
         color="#dceaf5"></a-box>

  <!-- Game Title -->
  <a-text value="THE MYSTERY ESCAPE ROOM"
          position="-2 3.3 -5.8"
          color="#172b4d"
          width="6"></a-text>

  <!-- Key -->
  <a-entity id="key" position="-3 0.7 -2"
            class="clickable">
    <a-cylinder radius="0.1" height="0.7"
                rotation="0 0 90"
                color="gold"></a-cylinder>
    <a-torus radius="0.2" radius-tubular="0.05"
             position="-0.35 0 0"
             color="gold"></a-torus>
  </a-entity>

  <!-- Box -->
  <a-box id="box"
         position="2 0.5 -2"
         width="1" height="0.8" depth="1"
         color="#89552d"
         class="clickable"></a-box>

  <!-- Exit Door -->
  <a-box id="door"
         position="0 1.5 -5.8"
         width="1.5" height="3" depth="0.2"
         color="#65446d"></a-box>

  <a-text value="EXIT"
          position="-0.4 1.5 -5.65"
          color="white"
          width="3"></a-text>

  <!-- Player Camera -->
  <a-entity position="0 0 4">
    <a-camera>
      <a-cursor
        raycaster="objects: .clickable">
      </a-cursor>
    </a-camera>
  </a-entity>

</a-scene>

<script>

// GAME VARIABLES
let hasKey = false;
let boxOpened = false;
let doorUnlocked = false;

// SELECT OBJECTS
const key = document.querySelector("#key");
const box = document.querySelector("#box");
const door = document.querySelector("#door");

// PUZZLE 1: FIND KEY
key.addEventListener("click", function() {

  hasKey = true;
  key.setAttribute("visible", false);

  alert("You found the key!");

});

// PUZZLE 2: OPEN BOX
box.addEventListener("click", function() {

  if (hasKey == true) {

    boxOpened = true;
    box.setAttribute("color", "green");

    alert("Box opened! The secret code is 2580.");

  } else {

    alert("You need to find the key first!");

  }

});

// PUZZLE 3: UNLOCK EXIT
door.addEventListener("click", function() {

  if (boxOpened == true) {

    let code = prompt("Enter the secret code:");

    if (code == "2580") {

      doorUnlocked = true;
      door.setAttribute("color", "green");

      alert("Congratulations! You escaped!");

    } else {

      alert("Wrong code! Try again.");

    }

  } else {

    alert("Solve the box puzzle first!");

  }

});

</script>

</body>
</html>
