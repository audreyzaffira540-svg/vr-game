<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deep Sea Submarine: Underwater VR Escape Room</title>
  
  <!-- A-Frame Library (GitHub Pages Compatible CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe-master.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #05141c;
    }

    /* Force A-Frame canvas to fill screen */
    a-scene {
      width: 100vw;
      height: 100vh;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Oceanic HUD Overlay */
    #hud {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 9999;
      background: rgba(5, 20, 35, 0.9);
      border: 2px solid #00d2ff;
      border-radius: 12px;
      padding: 15px 22px;
      color: #ffffff;
      width: 320px;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
      pointer-events: none;
    }

    #hud h2 {
      margin: 0 0 8px 0;
      font-size: 1.1rem;
      color: #00d2ff;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      text-shadow: 0 0 8px rgba(0, 210, 255, 0.6);
    }

    #objective {
      font-size: 0.9rem;
      color: #e2f1f8;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .status-box {
      font-size: 0.85rem;
      border-top: 1px solid rgba(0, 210, 255, 0.4);
      padding-top: 8px;
    }

    .status-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
    }

    .active { color: #00ffaa; font-weight: bold; text-shadow: 0 0 6px rgba(0, 255, 170, 0.6); }
    .inactive { color: #ff4466; }

    /* Win Screen */
    #win-screen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(5, 30, 25, 0.95);
      z-index: 10001;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #00ffaa;
      text-align: center;
    }

    #win-screen h1 { font-size: 3.8rem; text-shadow: 0 0 25px #00ffaa; margin-bottom: 10px; }
    #win-screen p { font-size: 1.5rem; color: #ffffff; }
    #restart-btn {
      margin-top: 20px;
      padding: 12px 28px;
      background: #00ffaa;
      color: #05141c;
      border: none;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 255, 170, 0.6);
    }
  </style>
</head>
<body>

  <!-- UI HUD -->
  <div id="hud">
    <h2>Submarine Objective</h2>
    <div id="objective">1. Locate the golden Brass Diver Valve on the laboratory workbench.</div>
    <div class="status-box">
      <div class="status-item">Brass Valve: <span id="st-valve" class="inactive">NO</span></div>
      <div class="status-item">Airlock Locker: <span id="st-locker" class="inactive">LOCKED</span></div>
      <div class="status-item">Sonar Scanner: <span id="st-light" class="inactive">NO</span></div>
      <div class="status-item">Hatch Exit: <span id="st-door" class="inactive">LOCKED</span></div>
    </div>
  </div>

  <!-- Win Screen -->
  <div id="win-screen">
    <h1>SURFACED TO SAFETY!</h1>
    <p>Submarine ballast tanks cleared and hatch successfully opened.</p>
    <button id="restart-btn" onclick="location.reload()">Play Again</button>
  </div>

  <!-- A-Frame 3D Scene -->
  <a-scene embedded cursor="rayOrigin: mouse" raycaster="objects: .clickable">
    
    <!-- Camera & Cursor -->
    <a-entity id="rig" position="0 0 3">
      <a-camera id="camera">
        <a-cursor 
          fuse="false" 
          raycaster="objects: .clickable" 
          material="color: #00ffaa; shader: flat" 
          position="0 0 -1" 
          geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.02">
        </a-cursor>
      </a-camera>
    </a-entity>

    <!-- Underwater Lighting -->
    <a-ambient-light color="#082b4a" intensity="1.2"></a-ambient-light>
    <a-point-light color="#0099ff" position="-3 5 -2" intensity="1.5"></a-point-light>
    <a-point-light color="#00ffaa" position="3 5 2" intensity="1.2"></a-point-light>

    <!-- Submarine Interior Hull Structure -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="14" height="14" color="#0b1d28" material="roughness: 0.3; metalness: 0.7"></a-plane>
    <a-plane position="0 7 0" rotation="90 0 0" width="14" height="14" color="#07141e"></a-plane>
    <a-plane position="0 3.5 -7" rotation="0 0 0" width="14" height="7" color="#091b26"></a-plane>
    <a-plane position="0 3.5 7" rotation="0 180 0" width="14" height="7" color="#091b26"></a-plane>
    <a-plane position="-7 3.5 0" rotation="0 90 0" width="14" height="7" color="#091b26"></a-plane>
    <a-plane position="7 3.5 0" rotation="0 -90 0" width="14" height="7" color="#091b26"></a-plane>

    <!-- Metal Hull Rib Accents -->
    <a-box position="0 6.8 -6.9" width="13.8" height="0.15" depth="0.15" color="#1c3b52"></a-box>
    <a-box position="0 6.8 6.9" width="13.8" height="0.15" depth="0.15" color="#1c3b52"></a-box>

    <!-- ===== OBJECT 1: LAB WORKBENCH & BRASS VALVE ===== -->
    <a-entity position="2 0 -2">
      <!-- Steel Work Desk -->
      <a-box position="0 0.9 0" width="2.4" height="0.15" depth="1.3" color="#132c3d" material="metalness: 0.6"></a-box>
      <a-box position="0 0.82 0" width="2.2" height="0.05" depth="1.1" color="#0077b6" material="emissive: #0077b6; emissiveIntensity: 0.3"></a-box>
      <!-- Desk Legs -->
      <a-cylinder position="-1 0.4 -0.5" radius="0.08" height="0.8" color="#1b3b52"></a-cylinder>
      <a-cylinder position="1 0.4 -0.5" radius="0.08" height="0.8" color="#1b3b52"></a-cylinder>
      <a-cylinder position="-1 0.4 0.5" radius="0.08" height="0.8" color="#1b3b52"></a-cylinder>
      <a-cylinder position="1 0.4 0.5" radius="0.08" height="0.8" color="#1b3b52"></a-cylinder>

      <!-- Interactive Brass Valve -->
      <a-cylinder id="valve" class="clickable" position="0 1.05 0" radius="0.18" height="0.08" color="#d4af37" material="metalness: 0.9" animation="property: rotation; to: 0 360 0; loop: true; dur: 5000">
        <a-text value="VALVE" align="center" rotation="-90 0 0" position="0 0.05 0" scale="0.4 0.4 0.4" color="#ffffff"></a-text>
      </a-cylinder>
    </a-entity>

    <!-- ===== OBJECT 2: EQUIPMENT LOCKER ===== -->
    <a-entity id="locker" position="-5 0 -2">
      <a-box position="0 1.8 0" width="1.4" height="3.4" depth="0.9" color="#0d2331"></a-box>
      <!-- Locker Door -->
      <a-box id="locker-door" class="clickable" position="-0.7 1.8 0.45" width="1.3" height="3.2" depth="0.1" color="#1b3b52" material="metalness: 0.7">
        <a-ring position="0 0 0.06" radius-inner="0.15" radius-outer="0.22" color="#00d2ff"></a-ring>
        <a-text id="locker-status" value="LOCKED" align="center" position="0 -0.8 0.06" scale="0.5 0.5 0.5" color="#ff4466"></a-text>
      </a-box>

      <!-- Sonar Scanner Inside Locker -->
      <a-box id="sonar" class="clickable" position="0 1.4 0.2" width="0.3" height="0.4" depth="0.2" color="#00ffaa" material="emissive: #00ffaa; emissiveIntensity: 0.6" visible="false">
        <a-text value="SONAR" align="center" rotation="0 0 0" position="0 0 0.11" scale="0.25 0.25 0.25" color="#05141c"></a-text>
      </a-box>
    </a-entity>

    <!-- ===== OBJECT 3: HOLOGRAPHIC TRENCH CHART ===== -->
    <a-entity position="0 3.5 -6.9">
      <a-plane id="chart-wall" position="0 0 0.02" width="3.5" height="1.8" color="#07141e" material="opacity: 0.3">
        <a-text id="chart-code-text" value="[ TRENCH DEPTH CODE: 4 - 2 - 7 ]" color="#00ffaa" align="center" position="0 0 0.01" scale="0.65 0.65 0.65" visible="false" material="emissive: #00ffaa; emissiveIntensity: 0.7"></a-text>
      </a-plane>
    </a-entity>

    <!-- ===== OBJECT 4: SUBMARINE HATCH CONTROL PANEL ===== -->
    <a-entity id="keypad-panel" position="2.2 2.2 -6.85">
      <a-box width="1.3" height="2" depth="0.12" color="#0d2331" material="metalness: 0.6"></a-box>
      <!-- Display Screen -->
      <a-plane position="0 0.6 0.07" width="1.1" height="0.45" color="#030b12">
        <a-text id="keypad-display" value="LOCKED" color="#ff4466" align="center" position="0 0 0.01" scale="0.75 0.75 0.75"></a-text>
      </a-plane>

      <!-- Keypad Buttons -->
      <a-box class="clickable btn-num" data-val="1" position="-0.35 0.1 0.07" width="0.22" height="0.22" depth="0.05" color="#1b3b52"><a-text value="1" align="center" position="0 0 0.03" scale="0.45 0.45 0.45" color="#00d2ff"></a-text></a-box>
      <a-box class="clickable btn-num" data-val="2" position="0 0.1 0.07" width="0.22" height="0.22" depth="0.05" color="#1b3b52"><a-text value="2" align="center" position="0 0 0.03" scale="0.45 0.45 0.45" color="#00d2ff"></a-text></a-box>
      <a-box class="clickable btn-num" data-val="3" position="0.35 0.1 0.07" width="0.22" height="0.22" depth="0.05" color="#1b3b52"><a-text value="3" align="center" position="0 0 0.03" scale="0.45 0.45 0.45" color="#00d2ff"></a-text></a-box>
      <a-box class="clickable btn-num" data-val="4" position="-0.35 -0.2 0.07" width="0.22" height="0.22" depth="0.05" color="#1b3b52"><a-text value="4" align="center" position="0 0 0.03" scale="0.45 0.45 0.45" color="#00d2ff"></a-text></a-box>
      <a-box class="clickable btn-num" data-val="5" position="0 -0.2 0.07" width="0.22" height="0.22" depth="0.05" color="#1b3b52"><a-text value="5" align="center" position="0 0 0.03" scale="0.45 0.45 0.45" color="#00d2ff"></a-text></a-box>
      <a-box class="clickable btn-num" data-val="6" position="0.35 -0.2 0.07" width="0.22" height="0.22" depth="0.05" color="#1b3b52"><a-text value="6" align="center" position="0 0 0.03" scale="0.45 0.45 0.45" color="#00d2ff"></a-text></a-box>
      <a-box class="clickable btn-num" data-val="7" position="-0.35 -0.5 0.07" width="0.22" height="0.22" depth="0.05" color="#1b3b52"><a-text value="7" align="center" position="0 0 0.03" scale="0.45 0.45 0.45" color="#00d2ff"></a-text></a-box>
      <a-box class="clickable btn-num" data-val="8" position="0 -0.5 0.07" width="0.22" height="0.22" depth="0.05" color="#1b3b52"><a-text value="8" align="center" position="0 0 0.03" scale="0.45 0.45 0.45" color="#00d2ff"></a-text></a-box>
      <a-box class="clickable btn-num" data-val="9" position="0.35 -0.5 0.07" width="0.22" height="0.22" depth="0.05" color="#1b3b52"><a-text value="9" align="center" position="0 0 0.03" scale="0.45 0.45 0.45" color="#00d2ff"></a-text></a-box>
    </a-entity>

    <!-- ===== ESCAPE HATCH DOORS ===== -->
    <a-entity id="exit-door-group" position="-1.8 0 -6.85">
      <a-box position="0 2.4 0" width="2.6" height="0.2" depth="0.25" color="#0077b6" material="emissive: #0077b6; emissiveIntensity: 0.4"></a-box>
      <a-box position="-1.2 1.2 0" width="0.2" height="2.4" depth="0.2" color="#1b3b52"></a-box>
      <a-box position="1.2 1.2 0" width="0.2" height="2.4" depth="0.2" color="#1b3b52"></a-box>
      
      <a-box id="door-left" position="-0.55 1.2 0" width="1.1" height="2.2" depth="0.06" color="#0d2331" material="metalness: 0.9">
        <a-box position="0.45 0 0.04" width="0.06" height="2" depth="0.03" color="#00d2ff" material="emissive: #00d2ff; emissiveIntensity: 0.5"></a-box>
      </a-box>
      <a-box id="door-right" position="0.55 1.2 0" width="1.1" height="2.2" depth="0.06" color="#0d2331" material="metalness: 0.9">
        <a-box position="-0.45 0 0.04" width="0.06" height="2" depth="0.03" color="#00d2ff" material="emissive: #00d2ff; emissiveIntensity: 0.5"></a-box>
      </a-box>
    </a-entity>

  </a-scene>

  <!-- Game Logic Script -->
  <script>
    const gameState = {
      hasValve: false,
      lockerOpen: false,
      hasScanner: false,
      sonarActive: false,
      enteredCode: "",
      targetCode: "427",
      isUnlocked: false
    };

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, duration) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + (duration / 1000));
    }

    function updateHUD(text) {
      if (text) document.getElementById('objective').innerText = text;
      
      const stValve = document.getElementById('st-valve');
      const stLocker = document.getElementById('st-locker');
      const stLight = document.getElementById('st-light');
      const stDoor = document.getElementById('st-door');

      if (gameState.hasValve) { stValve.innerText = "YES"; stValve.className = "active"; }
      if (gameState.lockerOpen) { stLocker.innerText = "OPEN"; stLocker.className = "active"; }
      if (gameState.hasScanner) { stLight.innerText = "YES"; stLight.className = "active"; }
      if (gameState.isUnlocked) { stDoor.innerText = "UNLOCKED"; stDoor.className = "active"; }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const valve = document.getElementById('valve');
      const lockerDoor = document.getElementById('locker-door');
      const sonar = document.getElementById('sonar');
      const chartCodeText = document.getElementById('chart-code-text');
      const keypadBtns = document.querySelectorAll('.btn-num');
      const keypadDisplay = document.getElementById('keypad-display');

      valve.addEventListener('click', () => {
        if (!gameState.hasValve) {
          gameState.hasValve = true;
          playBeep(550, 150);
          valve.setAttribute('visible', 'false');
          valve.classList.remove('clickable');
          updateHUD("2. Brass Valve acquired! Use it to unlock the Airlock Locker on the left wall.");
        }
      });

      lockerDoor.addEventListener('click', () => {
        if (gameState.hasValve && !gameState.lockerOpen) {
          gameState.lockerOpen = true;
          playBeep(750, 300);
          lockerDoor.setAttribute('animation', 'property: rotation; to: 0 -115 0; dur: 1000; easing: easeOutQuad');
          document.getElementById('locker-status').setAttribute('value', 'OPEN');
          document.getElementById('locker-status').setAttribute('color', '#00ffaa');
          sonar.setAttribute('visible', 'true');
          updateHUD("3. Locker open! Retrieve the Sonar Scanner from inside.");
        } else if (!gameState.hasValve) {
          playBeep(200, 200);
          updateHUD("Locker sealed! Collect the Brass Valve first.");
        }
      });

      sonar.addEventListener('click', () => {
        if (gameState.lockerOpen && !gameState.hasScanner) {
          gameState.hasScanner = true;
          playBeep(650, 200);
          sonar.setAttribute('visible', 'false');
          sonar.classList.remove('clickable');
          
          gameState.sonarActive = true;
          chartCodeText.setAttribute('visible', 'true');
          keypadDisplay.setAttribute('value', '---');
          keypadDisplay.setAttribute('color', '#00d2ff');

          updateHUD("4. Sonar Scanner active! Read the trench depth code (4-2-7) on the front wall chart, then enter it into the hatch control panel.");
        }
      });

      keypadBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          if (!gameState.hasScanner) {
            playBeep(150, 200);
            updateHUD("Panel unpowered! Collect the Sonar Scanner first.");
            return;
          }

          if (gameState.isUnlocked) return;

          const val = btn.getAttribute('data-val');
          playBeep(450, 100);
          
          gameState.enteredCode += val;
          keypadDisplay.setAttribute('value', gameState.enteredCode);

          if (gameState.enteredCode.length === 3) {
            if (gameState.enteredCode === gameState.targetCode) {
              gameState.isUnlocked = true;
              playBeep(900, 500);
              keypadDisplay.setAttribute('value', 'OPEN');
              keypadDisplay.setAttribute('color', '#00ffaa');
              updateHUD("Hatch Unlocked! Escape sequence initiated.");
              
              const doorLeft = document.getElementById('door-left');
              const doorRight = document.getElementById('door-right');
              doorLeft.setAttribute('animation', 'property: position; to: -1.6 1.2 0; dur: 2000; easing: easeOutQuad');
              doorRight.setAttribute('animation', 'property: position; to: 1.6 1.2 0; dur: 2000; easing: easeOutQuad');

              setTimeout(() => {
                document.getElementById('win-screen').style.display = 'flex';
              }, 2500);
            } else {
              playBeep(180, 400);
              keypadDisplay.setAttribute('value', 'ERR');
              keypadDisplay.setAttribute('color', '#ff4466');
              setTimeout(() => {
                gameState.enteredCode = "";
                keypadDisplay.setAttribute('value', '---');
                keypadDisplay.setAttribute('color', '#00d2ff');
              }, 1000);
            }
          }
        });
      });

      document.querySelectorAll('.clickable').forEach(el => {
        el.addEventListener('mouseenter', () => el.setAttribute('scale', '1.1 1.1 1.1'));
        el.addEventListener('mouseleave', () => el.setAttribute('scale', '1 1 1'));
      });
    });
  </script>
</body>
</html>
