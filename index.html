<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Laboratory - VR Escape Room</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        #hud {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 999;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border: 2px solid #00ff00;
            border-radius: 5px;
            font-size: 14px;
            max-width: 300px;
        }
        
        #status-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border: 3px solid #00ff00;
            border-radius: 5px;
            font-size: 20px;
            text-align: center;
            display: none;
            min-width: 400px;
        }
        
        #instructions {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            color: #ffff00;
            font-family: Arial, sans-serif;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 30px;
            border: 2px solid #ffff00;
            border-radius: 5px;
            font-size: 12px;
            text-align: center;
        }
        
        .puzzle-solved {
            color: #00ff00 !important;
        }
        
        .warning {
            color: #ff0000 !important;
        }
    </style>
</head>
<body>
    <!-- HUD Display -->
    <div id="hud">
        <div>STATUS: <span id="status">INITIALIZING</span></div>
        <div>PUZZLES SOLVED: <span id="puzzle-count">0/3</span></div>
        <div style="margin-top: 10px; font-size: 12px;">
            <div>Door Lock: <span id="door-status">LOCKED</span></div>
            <div>Chemicals: <span id="chemical-status">NOT MIXED</span></div>
            <div>Radiation: <span id="radiation-status">UNSAFE</span></div>
        </div>
    </div>
    
    <!-- Status Message -->
    <div id="status-message"></div>
    
    <!-- Instructions -->
    <div id="instructions">
        Click on objects to interact. Look for clues and solve puzzles to escape!
    </div>

    <!-- A-Frame Scene -->
    <a-scene background="color: #1a1a2e" fog="type: linear; color: #1a1a2e; far: 100">
        
        <!-- Camera with Raycaster for Interaction -->
        <a-entity id="camera" camera="userHeight: 1.6" position="0 0 5" look-controls wasd-controls>
            <a-entity cursor="fuse: true; fuseTimeout: 2000" 
                      position="0 0 -1"
                      geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                      material="color: #4CAF50; shader: flat">
            </a-entity>
            <a-entity raycaster="objects: .interactive" line="color: #4CAF50"></a-entity>
        </a-entity>

        <!-- LIGHTING -->
        <a-light type="ambient" color="#4a4a6a" intensity="0.6"></a-light>
        <a-light type="directional" color="#ffffff" intensity="0.8" position="5 10 5"></a-light>

        <!-- FLOOR -->
        <a-plane id="floor" position="0 0 0" rotation="-90 0 0" width="20" height="20" 
                  material="color: #2a2a4e; metalness: 0.6; roughness: 0.4;">
        </a-plane>

        <!-- WALLS -->
        <a-plane position="-10 5 0" rotation="0 0 0" width="20" height="10"
                  material="color: #16213e; metalness: 0.5; roughness: 0.5;">
        </a-plane>
        
        <a-plane position="10 5 0" rotation="0 0 0" width="20" height="10"
                  material="color: #16213e; metalness: 0.5; roughness: 0.5;">
        </a-plane>
        
        <a-plane position="0 5 -10" rotation="0 0 0" width="20" height="10"
                  material="color: #16213e; metalness: 0.5; roughness: 0.5;">
        </a-plane>

        <!-- CEILING -->
        <a-plane position="0 10 0" rotation="90 0 0" width="20" height="20"
                  material="color: #0f3460; metalness: 0.7; roughness: 0.3;">
        </a-plane>

        <!-- DOOR (Exit) -->
        <a-box id="exit-door" class="interactive" position="-9.8 4 -9.8" width="2" height="5" depth="0.3"
               material="color: #8b0000; metalness: 0.8; roughness: 0.2;">
        </a-box>
        
        <a-text id="door-label" value="EXIT DOOR" position="-9.8 5.5 -9.5" scale="2 2 2"
                color="#ffff00" align="center"></a-text>

        <!-- PUZZLE 1: KEYPAD (for Door Lock) -->
        <a-box id="keypad" class="interactive" position="-8 4 -9.6" width="1.5" height="2" depth="0.2"
               material="color: #222222; metalness: 0.9; roughness: 0.1;">
        </a-box>
        
        <a-text value="KEYPAD" position="-8 4.7 -9.4" scale="1.5 1.5 1.5"
                color="#00ff00" align="center"></a-text>

        <!-- PUZZLE 2: Chemical Mixer -->
        <a-cylinder id="chemical-mixer" class="interactive" position="5 1 -3" 
                    radius="0.8" height="1.5" material="color: #1a472a; metalness: 0.6; roughness: 0.4;">
        </a-cylinder>
        
        <a-text value="MIXER" position="5 2.2 -3" scale="1.5 1.5 1.5"
                color="#00ff00" align="center"></a-text>

        <!-- Chemical Container A -->
        <a-box id="chemical-a" class="interactive" position="3 1 -2" width="0.6" height="1.2" depth="0.6"
               material="color: #ff6b9d; metalness: 0.7; roughness: 0.3;">
        </a-box>
        
        <a-text value="RED CHEMICAL" position="3 2 -2" scale="1 1 1"
                color="#ffff00" align="center"></a-text>

        <!-- Chemical Container B -->
        <a-box id="chemical-b" class="interactive" position="7 1 -2" width="0.6" height="1.2" depth="0.6"
               material="color: #00d9ff; metalness: 0.7; roughness: 0.3;">
        </a-box>
        
        <a-text value="BLUE CHEMICAL" position="7 2 -2" scale="1 1 1"
                color="#ffff00" align="center"></a-text>

        <!-- PUZZLE 3: Radiation Shield -->
        <a-sphere id="radiation-source" position="-5 3 5" radius="1"
                   material="color: #ffff00; emissive: #ffff00; emissiveIntensity: 0.8;">
        </a-sphere>
        
        <a-text value="RADIATION" position="-5 4.5 5" scale="1.5 1.5 1.5"
                color="#ff0000" align="center"></a-text>

        <!-- Shield Control Panel -->
        <a-box id="shield-control" class="interactive" position="-5 2 2" width="1.5" height="2" depth="0.3"
               material="color: #4a4a4a; metalness: 0.8; roughness: 0.2;">
        </a-box>
        
        <a-text value="SHIELD CONTROL" position="-5 3.2 1.85" scale="1 1 1"
                color="#00ff00" align="center"></a-text>

        <!-- CLUE: Computer Terminal -->
        <a-box id="computer" position="8 2.5 8" width="1.5" height="1.5" depth="0.3"
               material="color: #000000; metalness: 0.9; roughness: 0.1;">
        </a-box>
        
        <a-plane id="screen" position="8 2.5 7.85" width="1.3" height="1.3"
                 material="color: #001a00; emissive: #001a00;">
        </a-plane>
        
        <a-text id="computer-text" value="NO ENTRY UNTIL:\n- DOOR UNLOCKED\n- CHEMICALS MIXED\n- RADIATION SAFE" 
                position="8 2.5 7.8" scale="0.8 0.8 0.8"
                color="#00ff00" align="center" baseline="center"></a-text>

        <!-- Decorative Elements -->
        <a-box position="-3 1 3" width="2" height="2" depth="2"
               material="color: #2a5a4a; metalness: 0.6; roughness: 0.4;">
        </a-box>
        
        <a-cylinder position="6 1 6" radius="0.5" height="3"
                    material="color: #1a3a5a; metalness: 0.7; roughness: 0.3;">
        </a-cylinder>

        <!-- Lighting Effects -->
        <a-light type="point" color="#ff6b9d" intensity="0.6" position="3 2 -2"></a-light>
        <a-light type="point" color="#00d9ff" intensity="0.6" position="7 2 -2"></a-light>
        <a-light type="point" color="#ffff00" intensity="0.8" position="-5 4 5"></a-light>

    </a-scene>

    <!-- JavaScript Logic -->
    <script>
        // ============ GAME STATE ============
        const gameState = {
            doorUnlocked: false,
            chemicalsMixed: false,
            radiationSafe: false,
            puzzlesSolved: 0,
            keypadAttempts: 0,
            chemicalA_used: false,
            chemicalB_used: false,
            shieldActivated: false,
            gameWon: false
        };

        // ============ DOM ELEMENTS ============
        const doorElement = document.getElementById('exit-door');
        const keypadElement = document.getElementById('keypad');
        const chemicalMixerElement = document.getElementById('chemical-mixer');
        const chemicalAElement = document.getElementById('chemical-a');
        const chemicalBElement = document.getElementById('chemical-b');
        const shieldControlElement = document.getElementById('shield-control');
        const radiationElement = document.getElementById('radiation-source');
        const statusMessage = document.getElementById('status-message');
        const statusSpan = document.getElementById('status');
        const puzzleCountSpan = document.getElementById('puzzle-count');
        const doorStatusSpan = document.getElementById('door-status');
        const chemicalStatusSpan = document.getElementById('chemical-status');
        const radiationStatusSpan = document.getElementById('radiation-status');

        // ============ HELPER FUNCTIONS ============
        
        /**
         * Display a message to the player
         * @param {string} message - The message to display
         * @param {number} duration - Duration to show message in milliseconds
         */
        function showMessage(message, duration = 3000) {
            statusMessage.textContent = message;
            statusMessage.style.display = 'block';
            setTimeout(() => {
                statusMessage.style.display = 'none';
            }, duration);
        }

        /**
         * Update the HUD display
         */
        function updateHUD() {
            statusSpan.textContent = gameState.gameWon ? 'ESCAPED!' : 'IN PROGRESS';
            puzzleCountSpan.textContent = `${gameState.puzzlesSolved}/3`;
            doorStatusSpan.textContent = gameState.doorUnlocked ? 'UNLOCKED' : 'LOCKED';
            doorStatusSpan.className = gameState.doorUnlocked ? 'puzzle-solved' : '';
            
            chemicalStatusSpan.textContent = gameState.chemicalsMixed ? 'MIXED' : 'NOT MIXED';
            chemicalStatusSpan.className = gameState.chemicalsMixed ? 'puzzle-solved' : '';
            
            radiationStatusSpan.textContent = gameState.radiationSafe ? 'SAFE' : 'UNSAFE';
            radiationStatusSpan.className = gameState.radiationSafe ? 'puzzle-solved' : '';
        }

        /**
         * Check if all puzzles are solved and open the door
         */
        function checkWinCondition() {
            if (gameState.doorUnlocked && gameState.chemicalsMixed && gameState.radiationSafe) {
                completeGame();
            }
        }

        /**
         * Complete the game when player escapes
         */
        function completeGame() {
            gameState.gameWon = true;
            gameState.gameWon = true;
            showMessage('🎉 ESCAPE SUCCESSFUL! 🎉\nYou have escaped The Laboratory!', 5000);
            doorElement.setAttribute('material', 'color: #00ff00; emissive: #00ff00; emissiveIntensity: 0.5;');
            updateHUD();
        }

        // ============ PUZZLE 1: KEYPAD (Door Lock) ============
        keypadElement.addEventListener('click', function() {
            if (gameState.doorUnlocked) {
                showMessage('Door is already unlocked!');
                return;
            }

            // Random code for this playthrough (can be changed to fixed)
            const correctCode = '1234';
            gameState.keypadAttempts++;

            // Simulate keypad interaction
            const userCode = prompt('Enter the door code (Hint: Look for clues!)');
            
            if (userCode === correctCode) {
                gameState.doorUnlocked = true;
                gameState.puzzlesSolved++;
                showMessage('✓ DOOR UNLOCKED!\nCode accepted: ' + correctCode);
                keypadElement.setAttribute('material', 'color: #00ff00; emissive: #00ff00;');
                updateHUD();
                checkWinCondition();
            } else {
                showMessage('✗ INCORRECT CODE\nAttempt ' + gameState.keypadAttempts + '\nTry again!');
            }
        });

        // ============ PUZZLE 2: Chemical Mixer ============
        chemicalAElement.addEventListener('click', function() {
            if (gameState.chemicalA_used) {
                showMessage('Red chemical already used in mixer!');
                return;
            }
            gameState.chemicalA_used = true;
            showMessage('Added RED CHEMICAL to mixer');
            chemicalAElement.setAttribute('material', 'color: #660000; metalness: 0.9;');
            checkChemicalMix();
        });

        chemicalBElement.addEventListener('click', function() {
            if (gameState.chemicalB_used) {
                showMessage('Blue chemical already used in mixer!');
                return;
            }
            gameState.chemicalB_used = true;
            showMessage('Added BLUE CHEMICAL to mixer');
            chemicalBElement.setAttribute('material', 'color: #003366; metalness: 0.9;');
            checkChemicalMix();
        });

        /**
         * Check if both chemicals have been added to mixer
         */
        function checkChemicalMix() {
            if (gameState.chemicalA_used && gameState.chemicalB_used && !gameState.chemicalsMixed) {
                gameState.chemicalsMixed = true;
                gameState.puzzlesSolved++;
                showMessage('✓ CHEMICALS MIXED!\nPurple solution created successfully!');
                chemicalMixerElement.setAttribute('material', 'color: #8b00ff; emissive: #8b00ff; emissiveIntensity: 0.6;');
                updateHUD();
                checkWinCondition();
            }
        }

        // ============ PUZZLE 3: Radiation Shield ============
        shieldControlElement.addEventListener('click', function() {
            if (gameState.radiationSafe) {
                showMessage('Radiation shield already activated!');
                return;
            }

            // Simple yes/no question to test understanding
            const userAnswer = prompt('Enter shield activation code (Hint: How many puzzle clues did you find?)\nAnswer should be a number.');
            
            if (userAnswer === '3' || userAnswer === 'three') {
                gameState.radiationSafe = true;
                gameState.shieldActivated = true;
                gameState.puzzlesSolved++;
                showMessage('✓ SHIELD ACTIVATED!\nRadiation levels normalized!');
                shieldControlElement.setAttribute('material', 'color: #00ff00; emissive: #00ff00;');
                radiationElement.setAttribute('material', 'color: #00aa00; emissive: #00aa00; emissiveIntensity: 0.4;');
                updateHUD();
                checkWinCondition();
            } else {
                showMessage('✗ INCORRECT ACTIVATION CODE\nTry thinking about what you\'ve seen...');
            }
        });

        // ============ EXIT DOOR INTERACTION ============
        doorElement.addEventListener('click', function() {
            if (gameState.gameWon) {
                showMessage('You have successfully escaped!');
            } else if (gameState.doorUnlocked) {
                if (gameState.chemicalsMixed && gameState.radiationSafe) {
                    completeGame();
                } else {
                    showMessage('Door is open, but you haven\'t solved all puzzles yet!\nAll systems must be operational to escape.');
                }
            } else {
                showMessage('✗ DOOR LOCKED\nYou need to enter the correct keypad code!');
            }
        });

        // ============ INITIALIZATION ============
        function initializeGame() {
            console.log('The Laboratory - VR Escape Room Initialized');
            updateHUD();
            showMessage('WELCOME TO THE LABORATORY\n\nSolve all puzzles to escape!\nGood luck!', 5000);
        }

        // Start game when page loads
        window.addEventListener('load', initializeGame);
    </script>
</body>
</html>
